name: Sori App Store Connect read-only check

# Read-only (GET) status check of the Sori app requested by the owner (2026-11-28).
# No writes, no submissions, no price or metadata changes.
on:
  push:
    branches: [ci/sori-asc-readonly]
    paths: ['.github/workflows/sori-asc-readonly.yml', 'ci/sori-asc/**']

permissions:
  contents: read

jobs:
  read:
    if: github.repository == 'jmpark0611-art/bestchoice' && github.ref == 'refs/heads/ci/sori-asc-readonly'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
      - name: Read Sori versions, builds, subscriptions and review drafts
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: node ci/sori-asc/readonly.mjs
