name: Genie iOS App Store IPA

# Lives only on ci/genie-ios-build. Builds web/ at SOURCE_SHA (this branch = SOURCE_SHA + ci files only)
# into a signed App Store IPA for com.jmpark0611.genie. Export only: no upload, no submission, no Android changes.
# Signing inputs are repository secrets (never printed): ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8,
# IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD. Without them the run stops after an unsigned
# preflight archive (Xcode/SDK, published-config check, web build, cap sync, compile).
# The only App Store Connect write is reusing-or-creating one IOS_APP_STORE profile (owner-approved).
on:
  push:
    branches: [ci/genie-ios-build]
    paths: ['.github/workflows/genie-ios-build.yml', 'ci/genie-ios/**']

permissions:
  contents: read

concurrency:
  group: genie-ios-build
  cancel-in-progress: false

env:
  SOURCE_SHA: 619a5fdc48b7ff6a49dfcc37ebab354330083c82
  ICON_SVG_SHA256: 40da87a9c53a174430cebde4bc658bb1143514e953db94eb8384eb14509d28f9
  BUNDLE_ID: com.jmpark0611.genie

jobs:
  ios:
    if: github.repository == 'jmpark0611-art/bestchoice' && github.ref == 'refs/heads/ci/genie-ios-build'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' && secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.IOS_DIST_CERT_PASSWORD != '' }}
      OUT: ${{ github.workspace }}/genie-ios-out
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm only CI files differ from SOURCE_SHA
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          changed=$(git diff --name-only "$SOURCE_SHA" HEAD)
          echo "$changed"
          if echo "$changed" | grep -v -E '^(\.github/workflows/genie-ios-build\.yml|ci/genie-ios/.*)$'; then
            echo "::error::App source differs from SOURCE_SHA"; exit 1; fi
          echo "$ICON_SVG_SHA256  web/public/genie-icon.svg" | shasum -a 256 -c -
          mkdir -p "$OUT"

      - name: Select Xcode 26+ and check the iPhoneOS SDK
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XCODE" ]; then echo "::error::No Xcode 26 on this runner image"; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iphoneos SDK $SDK"
          case "$SDK" in 26.*) ;; *) echo "::error::iPhoneOS SDK is $SDK, need 26.x"; exit 1;; esac
          { echo "XCODE_VERSION=$(xcodebuild -version | head -1)"; echo "IPHONEOS_SDK=$SDK"; } >> "$GITHUB_ENV"
          xcodebuild -help 2>&1 | sed -n '/Available keys for -exportOptionsPlist/,/^$/p' | grep -E '^\s+(method|destination|signingStyle|provisioningProfiles|signingCertificate|teamID|manageAppVersionAndBuildNumber|uploadSymbols|stripSwiftSymbols)' -A1 | head -60 || true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'

      - name: npm ci
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Check published production config fingerprint and build web
        working-directory: web
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import { loadPublishedReleaseConfig } from './scripts/android-public-config.mjs';
          const profile = JSON.parse(readFileSync('ANDROID-RELEASE-PROFILE.json', 'utf8'));
          if (profile.supabaseUrl !== 'https://njrtcxohbkfgrgwhlvua.supabase.co' || profile.publicAppUrl !== 'https://genie-web-rosy.vercel.app') process.exit(1);
          const published = await loadPublishedReleaseConfig({ profile });
          if (!published.ok) { console.error('CONFIG_FAIL ' + published.code); process.exit(1); }
          const env = Object.fromEntries(Object.entries(process.env).filter(([k]) => !k.startsWith('VITE_') && !k.startsWith('GENIE_')));
          for (const k of ['VITE_SUPABASE_URL', 'VITE_SUPABASE_PUBLISHABLE_KEY', 'VITE_PUBLIC_APP_URL']) env[k] = published.env[k];
          const r = spawnSync('npm', ['run', 'build'], { env, stdio: 'inherit' });
          if (r.status !== 0) process.exit(1);
          const evidence = { ...published.evidence };
          console.log('CONFIG_OK ' + JSON.stringify(evidence));
          appendFileSync(process.env.OUT + '/config-evidence.json', JSON.stringify(evidence, null, 2));
          JS

      - name: Import the existing Apple Distribution certificate (temporary keychain)
        if: env.HAS_SIGNING == 'true'
        env:
          P12_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/genie-signing.keychain-db"
          KCPW=$(openssl rand -hex 24)
          echo "::add-mask::$KCPW"
          printf '%s' "$P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          COUNT=$(security find-identity -v -p codesigning "$KC" | grep -c 'Distribution: ' || true)
          [ "$COUNT" = "1" ] || { echo "::error::Expected exactly one Apple Distribution identity, found $COUNT"; exit 1; }
          PEM=$(security find-certificate -a -c "Distribution: " -p "$KC")
          SERIAL=$(printf '%s\n' "$PEM" | openssl x509 -noout -serial | cut -d= -f2)
          SHA1=$(printf '%s\n' "$PEM" | openssl x509 -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')
          SUBJECT=$(printf '%s\n' "$PEM" | openssl x509 -noout -subject)
          ENDDATE=$(printf '%s\n' "$PEM" | openssl x509 -noout -enddate)
          echo "$SUBJECT"; echo "$ENDDATE"
          printf '%s\n' "$PEM" | openssl x509 -noout -checkend 0 || { echo "::error::Distribution certificate expired"; exit 1; }
          { echo "KC=$KC"; echo "CERT_SERIAL=$SERIAL"; echo "CERT_SHA1=$SHA1"; } >> "$GITHUB_ENV"

      - name: App Store Connect - existing app, next build number, App Store profile
        if: env.HAS_SIGNING == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          ASC_OUT="$OUT/asc-plan.json" PROFILE_OUT="$RUNNER_TEMP/genie.mobileprovision" node ci/genie-ios/asc.mjs plan "$CERT_SERIAL" "$BUNDLE_ID"
          UUID=$(node -p "require('$OUT/asc-plan.json').profile.uuid")
          TEAM=$(node -p "require('$OUT/asc-plan.json').bundleIdResource.teamId")
          BUILD=$(node -p "require('$OUT/asc-plan.json').buildNumber")
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$RUNNER_TEMP/genie.mobileprovision" "$d/$UUID.mobileprovision"; done
          security cms -D -i "$RUNNER_TEMP/genie.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PTEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          [ "$PTEAM" = "$TEAM" ] || { echo "::error::Profile team $PTEAM != bundle team $TEAM"; exit 1; }
          { echo "PROFILE_UUID=$UUID"; echo "TEAM_ID=$TEAM"; echo "BUILD_NUMBER=$BUILD"; } >> "$GITHUB_ENV"

      - name: Prepare iOS project (CI checkout only) and cap sync ios
        working-directory: web
        run: |
          set -euo pipefail
          if [ "$HAS_SIGNING" = "true" ]; then
            node ../ci/genie-ios/prepare.mjs . "$BUILD_NUMBER" "$TEAM_ID" "$PROFILE_UUID"
          else
            node ../ci/genie-ios/prepare.mjs . 1
          fi
          npx cap sync ios
          cat ios/App/App/capacitor.config.json; echo
          git -C .. status --short

      - name: Resolve Swift packages
        working-directory: web/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -resolvePackageDependencies

      - name: Unsigned preflight archive (no signing secrets)
        if: env.HAS_SIGNING != 'true'
        working-directory: web/ios/App
        run: |
          set -euo pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Genie-unsigned.xcarchive" CODE_SIGNING_ALLOWED=NO archive | tail -40
          plutil -p "$RUNNER_TEMP/Genie-unsigned.xcarchive/Products/Applications/App.app/Info.plist" | grep -E 'CFBundle(Identifier|DisplayName|ShortVersionString|Version)|DTSDKName|DTXcode"|MinimumOS'
          {
            echo "## Unsigned preflight passed"
            echo "$XCODE_VERSION, iPhoneOS SDK $IPHONEOS_SDK. Published config fingerprint matched, web built, cap sync ios, Release archive compiled."
            echo
            echo "Signing secrets are not set, so no IPA was produced. Add ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD and re-run."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Signing secrets missing - stopped after the unsigned preflight archive."

      - name: Archive (Release, generic iOS, existing certificate + App Store profile)
        if: env.HAS_SIGNING == 'true'
        working-directory: web/ios/App
        run: |
          set -euo pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Genie.xcarchive" archive | tail -40

      - name: Export App Store IPA (export only, no upload)
        if: env.HAS_SIGNING == 'true'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>${BUNDLE_ID}</key><string>${PROFILE_UUID}</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Genie.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" | tail -20
          ls -la "$RUNNER_TEMP/export"
          mv "$RUNNER_TEMP/export/"*.ipa "$OUT/genie-ios-1.0-release.ipa"
          ditto -c -k --keepParent "$RUNNER_TEMP/Genie.xcarchive" "$OUT/genie-ios-1.0-release.xcarchive.zip"

      - name: Verify IPA and write verification JSON
        if: env.HAS_SIGNING == 'true'
        run: |
          set -euo pipefail
          node ci/genie-ios/verify.mjs "$OUT/genie-ios-1.0-release.ipa" "$OUT/genie-ios-1.0-verification.json" \
            "$OUT/asc-plan.json" "$BUILD_NUMBER" "$TEAM_ID" "$CERT_SHA1"
          ( cd "$OUT" && shasum -a 256 genie-ios-1.0-release.ipa genie-ios-1.0-release.xcarchive.zip | tee SHA256SUMS )
          { echo '## Genie iOS 1.0 IPA (not uploaded)'; echo '```json'; cat "$OUT/genie-ios-1.0-verification.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep IPA, archive and verification (3 days)
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: genie-ios-1.0-release-${{ github.run_id }}
          path: |
            ${{ env.OUT }}/genie-ios-1.0-release.ipa
            ${{ env.OUT }}/genie-ios-1.0-release.xcarchive.zip
            ${{ env.OUT }}/genie-ios-1.0-verification.json
            ${{ env.OUT }}/SHA256SUMS
            ${{ env.OUT }}/config-evidence.json
          retention-days: 3
          if-no-files-found: error

      - name: Remove keychain and profiles
        if: always()
        run: |
          [ -n "${KC:-}" ] && security delete-keychain "$KC" || true
          rm -f "$RUNNER_TEMP"/*.mobileprovision "$RUNNER_TEMP"/profile.plist "$RUNNER_TEMP"/dist.p12
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
