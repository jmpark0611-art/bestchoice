name: Genie disposable local Supabase integration

# Approved public branch only. Synthetic users live only in a disposable Docker
# stack. No hosted project, model API, cache, credentials or artifact upload.
on:
  push:
    branches:
      - codex/genie-android-native-check-20261123
    paths:
      - 'web/scripts/local-stack-check*.mjs'
      - 'web/scripts/verify-local-integration*.mjs'
      - 'web/scripts/verify-local-reporting*.mjs'
      - 'web/scripts/verify-local-question-safety*.mjs'
      - 'web/qa/local-stack-fixture/**'
      - '.github/workflows/genie-local-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genie-disposable-local-integration
  cancel-in-progress: false

jobs:
  isolated-integration:
    if: >-
      github.repository == 'jmpark0611-art/bestchoice' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/codex/genie-android-native-check-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GENIE_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
      - name: Check only new isolation guards and the preserved deterministic fixture
        run: node --test web/scripts/local-stack-check.test.mjs web/scripts/verify-local-reporting.test.mjs web/scripts/verify-local-question-safety.test.mjs web/qa/local-stack-fixture/fixture.test.mjs
      - name: Verify the actual local Auth, PostgREST and Edge flow
        run: node web/scripts/local-stack-check.mjs --run-isolated
      - name: Confirm disposable stack cleanup even after interruption
        if: always()
        run: node web/scripts/local-stack-check.mjs --cleanup
