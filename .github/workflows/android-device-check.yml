name: Genie Android device check (isolated fixture)

# One disposable public standard runner. No production secrets, deployment,
# paid runner, cache, or SDK license acceptance. Only synthetic failure evidence
# may be retained for one day; no AVD, credentials, app storage or raw logcat.
on:
  push:
    branches:
      - codex/genie-android-native-check-20261123
    paths:
      - 'web/android/app/src/androidTest/java/dev/local/genie/preview/GenieDeviceCheck.java'
      - 'web/scripts/android-device-check*.mjs'
      - '.github/workflows/android-device-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genie-android-device-check
  cancel-in-progress: false

jobs:
  device-check:
    if: >-
      github.repository == 'jmpark0611-art/bestchoice' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/codex/genie-android-native-check-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: web
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require KVM and existing runner tools before downloading anything
        run: |
          test -c /dev/kvm
          test -x /usr/bin/unshare
          test -x /usr/bin/setpriv
          test -x /usr/sbin/ip
          test -x /usr/bin/python3
          test -x "${JAVA_HOME_21_X64}/bin/javac"
          test -f "${ANDROID_HOME}/platforms/android-36/android.jar"
          test -x "${ANDROID_HOME}/build-tools/35.0.0/aapt"
          test -x "${ANDROID_HOME}/platform-tools/adb"
          sudo -n chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          sudo -n unshare --net -- /usr/bin/true
          printf 'GENIE_DEVICE_WORK=%s/genie-device-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
      - name: Install only locked build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify only the new fixture driver's guards
        run: node --test scripts/android-device-check.test.mjs
      - name: Resolve official pins, check existing licenses, and build fixture APKs
        run: |
          node scripts/android-device-check.mjs prepare \
            --allow-tool-downloads \
            --work-dir "$GENIE_DEVICE_WORK" \
            --sdk-root "$ANDROID_HOME" \
            --java-home "$JAVA_HOME_21_X64"
      - name: Run the four cases with only loopback networking
        run: node scripts/android-device-check.mjs isolate --work-dir "$GENIE_DEVICE_WORK"
      - name: Record actual results and their limits
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          import path from 'node:path';
          const work = process.env.GENIE_DEVICE_WORK;
          const result = work && path.join(work, 'result.json');
          const receipt = result && existsSync(result)
            ? readFileSync(result, 'utf8')
            : JSON.stringify({ status: 'blocked-before-device-receipt', allFourCasesPassed: false, fixtureOnly: true, signedReleaseNotTested: true }, null, 2);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## Android emulator fixture check\n\nOnly the four named cases below are evaluated. A physical phone, signed release, shared voting, clipboard denial, and a real backend are not validated by this job.\n\n```json\n' + receipt + '\n```\n');
          JS
      - name: Retain only a synthetic failure screen and fixed state for one day
        if: failure() && env.GENIE_DEVICE_WORK != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: genie-device-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.GENIE_DEVICE_WORK }}/diagnostics/failure.png
            ${{ env.GENIE_DEVICE_WORK }}/diagnostics/state.json
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 1
          compression-level: 0
          overwrite: false
      - name: Remove this job's disposable files
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { lstatSync, existsSync, rmSync } from 'node:fs';
          import path from 'node:path';
          const work = process.env.GENIE_DEVICE_WORK;
          if (!work || !existsSync(work)) process.exit(0);
          if (!path.isAbsolute(work) || path.dirname(work) !== process.env.RUNNER_TEMP ||
              !/^genie-device-[0-9]+-[0-9]+$/.test(path.basename(work)) || lstatSync(work).isSymbolicLink()) {
            throw new Error('Unexpected disposable work directory');
          }
          rmSync(work, { recursive: true });
          JS
