name: Genie Android release configuration build (no upload)

# Standard public runner only. Builds the selected real configuration, but does
# not execute the app or contact its backend. AAB bytes are deleted, not uploaded.
on:
  push:
    branches:
      - codex/genie-android-native-check-20261123
    paths:
      - '.github/workflows/android-release-build-check.yml'
      - 'web/ANDROID-RELEASE-PROFILE.json'
      - 'web/src/**'
      - 'web/public/**'
      - 'web/android/**'
      - 'web/capacitor.config.*'
      - 'web/package*.json'
      - 'web/vite.config.*'
      - 'web/scripts/android-release*.mjs'
      - 'web/scripts/android-public-config.mjs'
      - 'web/scripts/android-unsigned-export.mjs'
      - 'web/scripts/android-packaged-assets.mjs'
      - 'web/scripts/android-bundle-identity.mjs'

permissions:
  contents: read

concurrency:
  group: genie-android-release-build-check
  cancel-in-progress: false

jobs:
  unsigned-release-check:
    if: >-
      github.repository == 'jmpark0611-art/bestchoice' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/codex/genie-android-native-check-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
      - name: Select existing Java 21 and Android SDK
        run: |
          test -x "${JAVA_HOME_21_X64}/bin/javac"
          test -x "${JAVA_HOME_21_X64}/bin/jarsigner"
          test -f "${ANDROID_HOME}/platforms/android-36/android.jar"
          test -x "${ANDROID_HOME}/build-tools/35.0.0/aapt2"
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$JAVA_HOME_21_X64" >> "$GITHUB_PATH"
          printf 'GRADLE_USER_HOME=%s/genie-release-check-gradle\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify published inputs and compile the unsigned release candidate
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import path from 'node:path';
          import { loadPublishedReleaseConfig } from './scripts/android-public-config.mjs';
          import { runUnsignedExport } from './scripts/android-unsigned-export.mjs';
          const profile = JSON.parse(readFileSync('ANDROID-RELEASE-PROFILE.json', 'utf8'));
          const published = await loadPublishedReleaseConfig({ profile });
          if (!published.ok) {
            console.error(published.code);
            process.exit(1);
          }
          const exportDir = path.join(process.env.RUNNER_TEMP, 'genie-unsigned-export-' + process.env.GITHUB_RUN_ID + '-' + process.env.GITHUB_RUN_ATTEMPT);
          const result = await runUnsignedExport({ webRoot: process.cwd(),
            env: { ...process.env, ...published.env }, exportDir, allowDownloads: true });
          if (!result.ok) {
            console.error('GENIE_RELEASE_BUILD_BLOCKER ' + result.code);
            process.exit(1);
          }
          const receipt = { ...result.receipt, publishedInputs: published.evidence,
            workflowStatus: 'unsigned-native-verified-discard-after-receipt',
            signingPending: true, retainedAab: false, artifactUploaded: false,
            backendContacted: false, storeSubmission: false };
          console.log('GENIE_RELEASE_BUILD_RECEIPT ' + JSON.stringify(receipt));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## Android release configuration build\n\nActual selected public configuration; unsigned AAB verified and deleted. No backend interaction, artifact upload, private signing key or store submission.\n\n```json\n' + JSON.stringify(receipt, null, 2) + '\n```\n');
          JS
      - name: Delete this run's unsigned output and preparation workspaces
        if: always()
        run: |
          rm -rf -- "${RUNNER_TEMP}/genie-unsigned-export-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${GITHUB_WORKSPACE}/web/.genie-release" "${RUNNER_TEMP}/genie-release-check-gradle"
