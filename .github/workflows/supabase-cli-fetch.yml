name: Genie official Supabase CLI fetch (no project inputs)

# Retrieve the exact public tool already used by the isolated checks.
# No checkout, CLI execution, project login, database call, secrets or cache.
on:
  push:
    branches:
      - codex/genie-android-native-check-20261123
    paths:
      - '.github/workflows/supabase-cli-fetch.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genie-official-supabase-cli-fetch
  cancel-in-progress: false

jobs:
  fetch-public-tool:
    if: >-
      github.repository == 'jmpark0611-art/bestchoice' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/codex/genie-android-native-check-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Download and inspect the pinned official archive and license
        run: |
          work="${RUNNER_TEMP}/genie-supabase-cli-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$work"
          mkdir -m 700 "$work"
          printf 'GENIE_SUPABASE_CLI_WORK=%s\n' "$work" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 --max-time 180 --max-filesize 67108864 \
            https://github.com/supabase/cli/releases/download/v3.2.0/supabase_3.2.0_linux_amd64.tar.gz \
            --output "$work/supabase.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 --max-time 60 --max-filesize 16384 \
            https://raw.githubusercontent.com/supabase/cli/c3c7a586b11b6605358177efabbc1b1cb7589b23/LICENSE \
            --output "$work/LICENSE"
          GENIE_SUPABASE_CLI_WORK="$work" python3 - <<'PY'
          import hashlib, json, os, pathlib, stat, tarfile

          def require(condition, code):
              if not condition:
                  raise RuntimeError(code)

          work = pathlib.Path(os.environ['GENIE_SUPABASE_CLI_WORK'])
          run_id, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
          require(run_id.isascii() and run_id.isdecimal() and attempt.isascii() and attempt.isdecimal(), 'RUN_ID_INVALID')
          expected_work = pathlib.Path(os.environ['RUNNER_TEMP']) / ('genie-supabase-cli-' + run_id + '-' + attempt)
          require(work == expected_work and work.is_absolute() and work.is_dir() and not work.is_symlink(), 'TOOL_WORKSPACE_INVALID')
          require(sorted(x.name for x in work.iterdir()) == ['LICENSE', 'supabase.tar.gz'], 'TOOL_INPUT_ALLOWLIST_MISMATCH')
          for p in work.iterdir():
              require(p.is_file() and not p.is_symlink(), 'TOOL_INPUT_INVALID')

          archive = work / 'supabase.tar.gz'
          expected_archive_sha = 'fb88b175a817563505be02c60872060bcb8d5c869a1aa5656eaeb085d4a2f1e4'
          require(archive.stat().st_size == 64347996, 'OFFICIAL_ARCHIVE_SIZE_MISMATCH')
          with archive.open('rb') as stream:
              require(hashlib.file_digest(stream, 'sha256').hexdigest() == expected_archive_sha, 'OFFICIAL_ARCHIVE_DIGEST_MISMATCH')
          license_data = (work / 'LICENSE').read_bytes()
          license_blob = hashlib.sha1(b'blob ' + str(len(license_data)).encode() + b'\0' + license_data).hexdigest()
          require(len(license_data) == 1088 and license_blob == 'f1802dffa876e2c43f6eeb74540b8afe10e39e68', 'OFFICIAL_LICENSE_MISMATCH')

          # Never use extract()/extractall(): archive paths and link targets cannot
          # select a destination. Only bytes of the single regular supabase entry
          # are copied into a fixed, exclusive local filename.
          with tarfile.open(archive, 'r:gz') as source:
              members = source.getmembers()
              require(0 < len(members) <= 32, 'ARCHIVE_ENTRY_COUNT_INVALID')
              names = [member.name for member in members]
              require(len(names) == len(set(names)), 'ARCHIVE_DUPLICATE_ENTRY')
              total = 0
              for member in members:
                  name = pathlib.PurePosixPath(member.name)
                  require(not name.is_absolute() and '..' not in name.parts and '\\' not in member.name and
                          all(ord(char) >= 32 and ord(char) != 127 for char in member.name), 'ARCHIVE_PATH_INVALID')
                  require(member.isfile() or member.isdir(), 'ARCHIVE_LINK_OR_SPECIAL_FILE')
                  require(member.size >= 0, 'ARCHIVE_SIZE_INVALID')
                  total += member.size
              require(total <= 256 * 1024 * 1024, 'ARCHIVE_EXPANSION_LIMIT')
              selected = [member for member in members if member.name == 'supabase']
              require(len(selected) == 1 and selected[0].isfile() and
                      1024 * 1024 <= selected[0].size <= 256 * 1024 * 1024, 'EXACT_CLI_ENTRY_REQUIRED')
              target = work / 'supabase'
              flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, 'O_NOFOLLOW', 0)
              copied, digest = 0, hashlib.sha256()
              with source.extractfile(selected[0]) as incoming, os.fdopen(os.open(target, flags, 0o500), 'wb') as output:
                  while True:
                      data = incoming.read(65536)
                      if not data:
                          break
                      copied += len(data)
                      require(copied <= selected[0].size, 'CLI_SIZE_MISMATCH')
                      digest.update(data)
                      output.write(data)
              require(copied == selected[0].size, 'CLI_SIZE_MISMATCH')
          with target.open('rb') as stream:
              header = stream.read(20)
          require(len(header) == 20 and header[:6] == b'\x7fELF\x02\x01' and header[18:20] == b'\x3e\x00', 'CLI_LINUX_AMD64_REQUIRED')
          os.chmod(target, 0o500)
          os.chmod(work / 'LICENSE', 0o400)
          archive.unlink()
          require(sorted(x.name for x in work.iterdir()) == ['LICENSE', 'supabase'], 'TOOL_OUTPUT_ALLOWLIST_MISMATCH')
          receipt = {
              'versionPin': '3.2.0', 'upstreamCommit': 'c3c7a586b11b6605358177efabbc1b1cb7589b23',
              'officialReleaseAssetId': 755638030, 'archiveSha256': expected_archive_sha,
              'archiveSizeBytes': 64347996, 'binaryFile': 'supabase', 'binarySha256': digest.hexdigest(),
              'binarySizeBytes': copied, 'license': 'MIT', 'licenseGitBlob': license_blob,
              'cliExecuted': False, 'appSourcePresent': False, 'projectCredentialsPresent': False,
              'backendContacted': False, 'migrationCreated': False,
              'repository': os.environ['GITHUB_REPOSITORY'], 'sourceCommit': os.environ['GITHUB_SHA'],
              'runId': run_id, 'runAttempt': attempt,
          }
          print('GENIE_SUPABASE_CLI_FETCH_RECEIPT ' + json.dumps(receipt, separators=(',', ':')))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Pinned official Supabase CLI only\n\n```json\n' + json.dumps(receipt, indent=2) + '\n```\n')
          PY
      - name: Keep only the official binary and its upstream license for one day
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: genie-official-supabase-cli-3.2.0-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.GENIE_SUPABASE_CLI_WORK }}/supabase
            ${{ env.GENIE_SUPABASE_CLI_WORK }}/LICENSE
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1
          compression-level: 6
          overwrite: false
      - name: Remove this run's public tool copies
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil
          run_id, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
          if not (run_id.isascii() and run_id.isdecimal() and attempt.isascii() and attempt.isdecimal()):
              raise RuntimeError('RUN_ID_INVALID')
          work = pathlib.Path(os.environ['RUNNER_TEMP']) / ('genie-supabase-cli-' + run_id + '-' + attempt)
          configured = os.environ.get('GENIE_SUPABASE_CLI_WORK')
          if configured is not None and configured != str(work):
              raise RuntimeError('TOOL_CLEANUP_REFUSED')
          if work.is_symlink():
              raise RuntimeError('TOOL_CLEANUP_REFUSED')
          if work.exists():
              if not work.is_dir():
                  raise RuntimeError('TOOL_CLEANUP_REFUSED')
              shutil.rmtree(work)
          PY
