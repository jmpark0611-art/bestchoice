name: Genie Android unsigned candidate export

# A single short-lived unsigned export from the approved PUBLIC repository.
# No signing secrets, backend interaction, cache, deployment or store submission.
# Only edits to this workflow trigger a new export; app changes do not upload it.
on:
  push:
    branches:
      - codex/genie-android-native-check-20261123
    paths:
      - '.github/workflows/android-release-export.yml'

permissions:
  contents: read

concurrency:
  group: genie-android-candidate-export
  cancel-in-progress: false

jobs:
  unsigned-export:
    if: >-
      github.repository == 'jmpark0611-art/bestchoice' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/codex/genie-android-native-check-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
      - name: Select existing native tools and a run-specific export path
        run: |
          test -x "${JAVA_HOME_21_X64}/bin/javac"
          test -x "${JAVA_HOME_21_X64}/bin/jarsigner"
          test -f "${ANDROID_HOME}/platforms/android-36/android.jar"
          test -x "${ANDROID_HOME}/build-tools/35.0.0/aapt2"
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$JAVA_HOME_21_X64" >> "$GITHUB_PATH"
          printf 'GRADLE_USER_HOME=%s/genie-export-gradle\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'GENIE_EXPORT_DIR=%s/genie-unsigned-export-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and verify the four-file unsigned export
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, statSync, appendFileSync } from 'node:fs';
          import { loadPublishedReleaseConfig } from './scripts/android-public-config.mjs';
          import { runUnsignedExport } from './scripts/android-unsigned-export.mjs';
          const profile = JSON.parse(readFileSync('ANDROID-RELEASE-PROFILE.json', 'utf8'));
          const published = await loadPublishedReleaseConfig({ profile });
          if (!published.ok) { console.error(published.code); process.exit(1); }
          const result = await runUnsignedExport({ webRoot: process.cwd(), env: { ...process.env, ...published.env },
            exportDir: process.env.GENIE_EXPORT_DIR, allowDownloads: true });
          if (!result.ok) { console.error(result.code); process.exit(1); }
          if (statSync(result.artifactPath).size > 250 * 1024 * 1024) {
            console.error('UNSIGNED_EXPORT_SIZE_LIMIT'); process.exit(1);
          }
          console.log('GENIE_UNSIGNED_EXPORT_RECEIPT ' + JSON.stringify(result.receipt));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## Unsigned Android candidate\n\nVerified selected public configuration. Private signing key remains local. The following preparation receipt is unchanged by artifact delivery.\n\n```json\n'
            + JSON.stringify(result.receipt, null, 2) + '\n```\n');
          JS
      - name: Retain exactly this unsigned export for one day
        id: export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: genie-android-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.GENIE_EXPORT_DIR }}
          retention-days: 1
          compression-level: 0
          include-hidden-files: false
          overwrite: false
          if-no-files-found: error
      - name: Record artifact identity for independent local verification
        env:
          GENIE_ARTIFACT_ID: ${{ steps.export.outputs.artifact-id }}
          GENIE_ARTIFACT_SHA256: ${{ steps.export.outputs.artifact-digest }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          if (!/^[1-9][0-9]*$/.test(process.env.GENIE_ARTIFACT_ID || '') ||
              !/^[a-f0-9]{64}$/.test(process.env.GENIE_ARTIFACT_SHA256 || '')) process.exit(1);
          const record = { repository: process.env.GITHUB_REPOSITORY, sourceCommit: process.env.GITHUB_SHA,
            sourceRef: process.env.GITHUB_REF, runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            artifactId: process.env.GENIE_ARTIFACT_ID, artifactSha256: process.env.GENIE_ARTIFACT_SHA256,
            artifactUploaded: true, retentionDays: 1, unsignedOnly: true, privateSigningKeyUploaded: false,
            backendContacted: false, storeSubmission: false };
          console.log('GENIE_ARTIFACT_EXPORT_RECEIPT ' + JSON.stringify(record));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\n## Artifact delivery record\n\n```json\n' + JSON.stringify(record, null, 2) + '\n```\n');
          JS
      - name: Delete this run's local export and build workspaces
        if: always()
        run: |
          rm -rf -- "${RUNNER_TEMP}/genie-unsigned-export-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${GITHUB_WORKSPACE}/web/.genie-release" "${RUNNER_TEMP}/genie-export-gradle"
